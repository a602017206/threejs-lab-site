  <script type="module" crossorigin src="./assets/transformer2-_qKl-7rT.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/three.module-Boxh9JUz.js">
  <link rel="modulepreload" crossorigin href="./assets/BufferGeometryUtils-m9TQVdUn.js">
  <link rel="modulepreload" crossorigin href="./assets/meshopt_decoder.module-B5HM5sAQ.js">
  <link rel="modulepreload" crossorigin href="./assets/style-D8iSa_lH.js">
  <link rel="modulepreload" crossorigin href="./assets/OrbitControls-3A4OAO9m.js">
  <link rel="modulepreload" crossorigin href="./assets/Reflector-DZ-Kww_3.js">

<body data-faction="autobot" class="tf2">
  <div id="tf-gl"></div>

  <header class="tf-top">
    <a class="tf-brand" href="./" title="返回首页">
      <span class="tf-code">TRANS2</span>
      <span class="tf-title">变形金刚 · 电影版<small>Transformers Live-Action · <span id="tf-count">9</span> 位角色 · 电影造型模型</small></span>
    </a>
    <div class="tf-keys"><kbd>空格</kbd> 变形 <kbd>R</kbd> 出击演示 <kbd>1–9</kbd> 切换角色</div>
  </header>

  <aside class="tf-side">
    <ol class="tf-list" id="tf-list"></ol>
  </aside>

  <article class="tf-info" id="tf-info"></article>

  <div class="tf2-loading" id="tf-loading"></div>

  <footer class="tf-dock">
    <button class="tf-go" id="tf-go"><b>⟳</b>变形 · 机器人</button>
    <button class="tf-roll" id="tf-rollout"><b>➤</b>出击演示</button>
    <label class="tf-scrub">
      <span>载具</span>
      <input type="range" id="tf-scrub" min="0" max="1000" value="0" />
      <span>机器人</span>
      <b id="tf-scrub-val">0%</b>
    </label>
    <div class="tf-seg" id="tf-speed">
      <button data-speed="0.25">慢镜</button>
      <button data-speed="0.5">0.5×</button>
      <button data-speed="1" class="active">1×</button>
      <button data-speed="2">2×</button>
    </div>
    <div class="tf-seg" id="tf-views"></div>
    <div class="tf-seg" id="tf-toggles">
      <button data-toggle="spin">转台</button>
      <button data-toggle="sound" class="active">音效</button>
    </div>
  </footer>

  <div class="tf-credit tf2-credit">
    <div id="tf2-credits"></div>
    <div>Transformers 及角色名为孩之宝（Hasbro）商标。模型来自 Sketchfab 社区作者，按 CC BY 授权署名使用，仅作非商业技术演示。</div>
  </div>

  <div id="tf-loader"><div class="tf-loader-text">正在启动电影版机库…</div></div>

</body>
</html>
